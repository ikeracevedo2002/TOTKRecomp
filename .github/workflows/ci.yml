name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / GCC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build libssl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTOTKRECOMP_ENABLE_LLVM=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: CLI smoke test
        run: |
          build/nso-inspect --help
          build/nso-inspect --version
          build/aarch64-analyze --help
          build/aarch64-analyze --version
          build/aarch64-lift --hex 0000018bc0035fd6 --show-ir --execute-ir

  linux-llvm:
    name: Linux / GCC / LLVM 18
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libssl-dev llvm-18-dev=1:18.1.3-1ubuntu1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTOTKRECOMP_ENABLE_LLVM=ON -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: LLVM lift smoke test
        run: build/aarch64-lift --hex 0000018bc0035fd6 --show-disassembly --show-ir --show-llvm --execute-ir --execute-native

  linux-sanitizers:
    name: Linux / GCC / ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build libssl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTOTKRECOMP_ENABLE_LLVM=OFF -DTOTKRECOMP_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-thread-sanitizer:
    name: Linux / GCC / TSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build libssl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTOTKRECOMP_ENABLE_LLVM=OFF -DTOTKRECOMP_ENABLE_THREAD_SANITIZER=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows / MSVC
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: CLI smoke test
        run: |
          build/Debug/nso-inspect.exe --help
          build/Debug/nso-inspect.exe --version
          build/Debug/aarch64-analyze.exe --help
          build/Debug/aarch64-analyze.exe --version
          build/Debug/aarch64-lift.exe --hex 0000018bc0035fd6 --show-ir --execute-ir
